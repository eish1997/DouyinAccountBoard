<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 抖音账号工作台</title><link rel="stylesheet" href="/auth.css"></head>
<body class="login-page"><section class="login-box"><div class="login-brand">矩 · 抖音账号工作台</div><h1 id="loginTitle">登录工作台</h1><p id="loginHint">每人独立登录，共用一份工作数据。</p><form id="loginForm"><label id="setupName" hidden>你的姓名<input id="loginName" maxlength="60" autocomplete="name"></label><label>登录名<input id="loginUsername" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]+" autocomplete="username" placeholder="字母或数字，例如 admin"></label><label>密码<input id="loginPassword" type="password" required minlength="10" maxlength="128" autocomplete="current-password" placeholder="至少10位"></label><label id="confirmField" hidden>确认密码<input id="loginConfirm" type="password" minlength="10" maxlength="128" autocomplete="new-password"></label><p id="loginError" role="alert"></p><button id="loginSubmit" type="submit">登录</button></form><p class="login-footer">只有总管理员可以创建人员、调整权限和停用账号。</p></section><script src="/login.js?v=20261020-office3"></script></body></html>
