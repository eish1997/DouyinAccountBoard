<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日工作与管理</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/auth.css"><link rel="stylesheet" href="/users.css"><link rel="stylesheet" href="/workspace.css?v=20261019-nurture"><link rel="stylesheet" href="/batch-edit.css?v=20261020"></head><body>
<aside><div class="brand"><span class="brand-icon">矩</span><div>账号工作台<small>DOUYIN ACCOUNT BOARD</small></div></div><div class="nav-label">工作空间</div><nav><a class="active" href="/workspace.html">◷　今日工作与管理</a><a href="/">▦　发布看板 / 账号编辑</a><a href="/users.html" id="peopleLink" hidden>♙　子账号与权限</a></nav><div class="sidebar-bottom">同一份数据 · 操作可追溯<small>影刀继续执行原发布流程</small></div></aside>
<main><header><div><div class="breadcrumb">工作台 / 工作管理</div><h1>今日工作与管理</h1><p id="workspaceUser" class="permission-note"></p></div><div class="auth-actions"><input id="workDate" type="date" aria-label="发布记录日期"><button id="reloadWorkspace" class="button">刷新资料</button><a href="/" class="button">返回看板</a></div></header><p id="workspaceError" role="alert"></p><div class="workspace-tabs"><button data-work-tab="nurture" class="button">7日养号面板</button><button data-work-tab="todo" class="button primary">今日待办</button><button data-work-tab="accounts" class="button">账号总览</button><button data-work-tab="positions" class="button">发布位置</button><button data-work-tab="history" class="button">操作历史</button><button data-work-tab="exchange" class="button">导入 / 导出</button><button data-work-tab="backups" class="button">备份与恢复</button></div>
<section class="collection-bar" aria-label="作品采集进度与控制"><div><strong>公开作品数量 · 采集进度</strong><p id="workCollectionInfo" role="status">正在读取采集进度…</p><p id="workCollectionError" role="alert"></p></div><div class="collection-actions"><button id="workCollectionPause" class="button primary" disabled>暂停队列</button><button id="workCollectionResume" class="button" hidden disabled>继续采集</button><button id="workCollectionRefresh" class="button">刷新进度</button><a href="/" class="button">选择账号采集</a></div></section><section class="workspace" id="workspaceBody"><p>正在读取共享资料…</p></section>
</main>
<dialog id="overviewDialog"><div class="dialog-head"><h2 id="overviewTitle">账号总览</h2><button id="closeOverview" class="text-button">关闭</button></div><div id="overviewBody"></div></dialog>
<dialog id="positionDialog"><form id="positionForm"><div class="dialog-head"><h2>调整实际发布位置</h2><button type="button" id="closePosition" class="text-button">关闭</button></div><p id="positionSource"></p><p class="permission-note">移动只改变实际发布安排，保留账号资料中原登记电脑、登录手机和历史发布记录。只允许同设备批次的空白格。</p><label>目标空白发布格<select id="positionTarget" required></select></label><p id="positionError" role="alert"></p><div class="auth-actions"><button id="removeAssignment" type="button" class="button">取消此发布安排</button><button type="submit" class="button primary">确认移动</button></div><p class="permission-note">取消安排后账号资料仍保留；原格子变为空白，操作前后值可在历史查看。</p></form></dialog>
<script src="/scope-ui.js"></script><script src="/identity-labels.js?v=20261020-clean"></script><script src="/field-search.js?v=20261020-clean"></script><script src="/edit-versions.js?v=20261020-clean"></script><script src="/workspace-model.js?v=20261020-clean"></script><script src="/nurture.js?v=20261020-clean"></script><script src="/batch-edit.js?v=20261020-clean"></script><script src="/workspace.js?v=20261025-http-uuid"></script><script src="/collection-panel.js?v=20261020-clean"></script></body></html>
